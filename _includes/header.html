<header>
    <h1><a href="{{ site.url }}">Diatope - L'aménagement dans toutes ses dimensions</a></h1>
    <!-- Le menu de navigation du site. Renvoie vers la page d'archives relative à chaque catégorie ainsi que vers une page "A propos".
     Chaque page d'archives est générée à l'aide du plugin jekyll-archives -->
    <nav aria-labelledby="menu principal">
        <ul>
            {% for category in site.categories %}
            {% assign category-name = category[0] %}
            {% assign category-slug = category[0] | slugify %}
            <li><a href="/categories/{{ category-slug }}/">{{ category-name }}</a></li>
            {% endfor %}
            <li><a href="about.html">A propos</a></li>
        </ul>
    </nav>
</header>
